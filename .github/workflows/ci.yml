# Checks every pull request and every push to main: backend tests, frontend type-check, tests and
# build (and that the committed public/app build matches the source), the MCP server build,
# dependency audits (composer audit, npm audit for runtime deps), shellcheck on deploy/ and node scripts,
# and every migration applied to a real MySQL 8.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, sqlite3, mysqli, gd, zip
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php8.3-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Composer audit (known vulnerabilities)
        run: composer audit --no-interaction
      - name: PHP syntax
        run: find app -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - run: mkdir -p writable/{cache,logs,session,uploads,debugbar}
      - run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build
      - name: Committed public/app matches the source
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- public/app)" ]; then
            echo "::error::public/app is out of date. Run 'cd frontend && npm run build' and commit public/app."
            git status --short -- public/app | head -20
            exit 1
          fi

  mcp-server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck deploy scripts
        run: find deploy -name '*.sh' -print0 | xargs -0 shellcheck
      # The scripts GPU nodes download and run: warnings and errors fail the build.
      - name: shellcheck node scripts
        run: shellcheck -S warning public/node/*.sh
      - name: Python syntax (node and speech scripts)
        run: python3 -m py_compile public/node/*.py deploy/asr/*.py

  # Production runs MySQL; the unit tests run on SQLite. Apply every migration to a real MySQL 8
  # (default sql_mode, incl. ONLY_FULL_GROUP_BY), then again to prove a re-run is a no-op.
  migrations-mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aistudio
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI_ENVIRONMENT: development
      database.default.hostname: 127.0.0.1
      database.default.database: aistudio
      database.default.username: root
      database.default.password: root
      database.default.DBDriver: MySQLi
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: mkdir -p writable/{cache,logs,session,uploads,debugbar}
      - name: Migrate a fresh database
        run: php spark migrate --all
      - name: Seed roles and permissions
        run: php spark db:seed AuthSeeder
      - name: Re-running migrations is a no-op
        run: php spark migrate --all
      - name: Model listing queries run under ONLY_FULL_GROUP_BY
        run: php spark gateway:selftest
