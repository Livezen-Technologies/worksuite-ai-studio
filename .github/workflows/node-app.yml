# Builds the AI Studio Node desktop app (node-app/) for Windows, macOS and Linux.
# Run it from the Actions tab, or push a tag like node-app-v1.0.0. The installers are attached to the run as
# artifacts (and to a draft release for tags); copy them to public/node/downloads/ on the server.
name: Node app

on:
  workflow_dispatch:
  push:
    tags: ['node-app-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci || npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: node-app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'AI Studio Node __VERSION__' || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: aistudio-node-${{ matrix.os }}
          path: |
            node-app/src-tauri/target/**/release/bundle/**/*.exe
            node-app/src-tauri/target/**/release/bundle/**/*.msi
            node-app/src-tauri/target/**/release/bundle/**/*.dmg
            node-app/src-tauri/target/**/release/bundle/**/*.deb
            node-app/src-tauri/target/**/release/bundle/**/*.rpm
            node-app/src-tauri/target/**/release/bundle/**/*.AppImage
