# Alert rules for WorkSuite AI Studio (loaded by prometheus-ollamahub.yml). Firing alerts show
# on Prometheus' /alerts page; add an Alertmanager to get them by email/Slack.
groups:
  - name: aistudio
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.job }}) is not answering"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 0.85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full"

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} has under 10% memory available"

      - alert: BackupStale
        # node_exporter textfile collector: deploy/backup-db.sh writes aistudio_backup_last_success_seconds.
        expr: time() - aistudio_backup_last_success_seconds > 30 * 3600
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "No successful database backup for over 30 hours"

      - alert: SchedulerStale
        # `spark schedule:run` (cron, every minute) writes aistudio_scheduler_last_success_seconds.
        expr: time() - aistudio_scheduler_last_success_seconds > 15 * 60
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Scheduled jobs have not run for 15 minutes (cron stopped or schedule:run failing)"

      - alert: QueueWorkerStale
        # ollamahub-queue writes aistudio_queue_last_success_seconds after every pass.
        expr: time() - aistudio_queue_last_success_seconds > 10 * 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The queue worker has not finished a pass for 10 minutes"

      - alert: ModelAutoloadStale
        # The model load policy job (every 5 minutes) writes aistudio_model_autoload_last_success_seconds.
        expr: time() - aistudio_model_autoload_last_success_seconds > 30 * 60
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Model load policy (keep loaded / unload when idle) has not run for 30 minutes"

      - alert: BackupRestoreStale
        # deploy/verify-backup.sh (weekly) writes aistudio_backup_restore_ok_seconds after a good test restore.
        expr: time() - aistudio_backup_restore_ok_seconds > 8 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No successful backup restore test for over 8 days"

      - alert: AiServiceDown
        # blackbox probe of the speech (8096) and ML (8097) services' /health.
        expr: probe_success{job="blackbox-services"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.service }} service is not answering /health"

      - alert: SiteDown
        expr: probe_success{job="blackbox-site"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering 2xx from outside the app"

      - alert: ServiceDown
        expr: node_systemd_unit_state{state="active"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "systemd unit {{ $labels.name }} on {{ $labels.instance }} is not active"
