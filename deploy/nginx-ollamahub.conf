# OllamaHub nginx vhost. Serves the CI4 public/ docroot; the React SPA lives at
# /app/ (built into public/app) with SPA fallback. Replace server_name with your
# domain once DNS is set, then add Let's Encrypt (certbot --nginx).
server {
    listen 80;
    server_name 40.160.57.17;  # change to your domain when ready

    root /var/www/ollamahub/public;
    index index.php index.html;

    client_max_body_size 50M;  # knowledge-base file uploads

    # SPA deep links: /app/* falls back to the built index.html
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 600;  # long Ollama streams
    }

    location ~ /\.(?!well-known).* { deny all; }
}
