# WorkSuite AI Studio nginx vhost. Serves the CI4 public/ docroot: /api/ goes to CodeIgniter, the
# React app (built into public/app) answers every other path, so /, /login and /app/... all work.
#
# install-server.sh replaces __DOMAIN__ and then runs certbot, which adds the HTTPS server
# (listen 443 ssl, certificates) and the HTTP -> HTTPS redirect to this file. Do not serve the
# app over plain HTTP: sign-in tokens and node enrolment tokens would travel in clear.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/ollamahub/public;
    index index.html;

    server_tokens off;
    include snippets/aistudio-security.conf;

    client_max_body_size 50M;  # knowledge-base and dataset uploads

    # Compression for text assets and API JSON.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # Basic brute-force damping on sign-in (the app also rate-limits per account).
    location = /api/auth/login {
        limit_req zone=aistudio_auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # API (CodeIgniter). Every backend route lives under /api/. A per-IP limit at the edge keeps
    # floods off PHP (the app also rate-limits per key and per account).
    location /api/ {
        limit_req zone=aistudio_api burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Credential endpoints: token exchange, enrolment, second factor, refresh.
    location ~ ^/api/(v1/oauth/token|nodes/enrol|auth/(mfa|passkey|refresh)) {
        limit_req zone=aistudio_auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Audio and video for speech to text: up to 500 MB, streamed to PHP instead of buffered.
    location ~ ^/api/(speech/transcribe|openai/v1/audio/) {
        client_max_body_size 512M;
        client_body_timeout 300s;
        limit_req zone=aistudio_api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Built frontend assets (hashed file names: cache for a year).
    location /assets/ {
        alias /var/www/ollamahub/public/app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/aistudio-security.conf;
    }

    # The React app and public site are served from the root: real files under public/ first
    # (node scripts, downloads, favicon), everything else is a client-side route.
    location = / {
        try_files /app/index.html =404;
    }
    location / {
        try_files $uri /app/index.html;
    }

    # Only the CodeIgniter front controller runs PHP; any other *.php (stray scripts, uploads) is 404.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 600;  # long Ollama streams
        # Streamed answers (chat, SSE on /api/openai/v1) go out token by token, whatever headers a
        # handler remembers to send; uploads stream to PHP as they arrive.
        fastcgi_buffering off;
        fastcgi_request_buffering off;
    }
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }

    # Optional: MCP server (mcp-server/, `npm run start:http`) behind this host. access_log off so
    # a secret in the URL (/mcp/<secret>) never lands in the logs.
    # location /mcp {
    #     access_log off;
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_buffering off;
    #     proxy_read_timeout 600;
    # }
}
