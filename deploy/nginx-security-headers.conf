# Security headers for WorkSuite AI Studio. Installed to /etc/nginx/snippets/aistudio-security.conf
# and included by the vhost. HSTS only takes effect over HTTPS (after certbot), which is the point.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;  # matches CodeIgniter secureheaders
# Microphone stays allowed for this site: Speech to Text records in the browser.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
