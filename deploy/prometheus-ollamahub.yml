# Minimal Prometheus config for WorkSuite AI Studio. Scrapes the local node_exporter so the
# Monitoring page shows real CPU/RAM/disk. Add a job per remote Ollama node (its
# node_exporter, and an nvidia GPU exporter on GPU nodes) as you register them.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/aistudio-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']   # node_exporter on this control-plane node
        labels:
          instance: 'aistudio-main'

  # Outside-in check of the public site (prometheus-blackbox-exporter on :9115). install-server.sh
  # replaces __DOMAIN__ with AISTUDIO_DOMAIN.
  - job_name: blackbox-site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://__DOMAIN__/api/ping']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9115'

  # The speech (aistudio-asr) and ML (aistudio-ml) services answer /health on localhost.
  - job_name: blackbox-services
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://127.0.0.1:8096/health']
        labels: { service: speech }
      - targets: ['http://127.0.0.1:8097/health']
        labels: { service: ml }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9115'

  # Example for a future GPU node (uncomment + set its IP):
  # - job_name: node-gpu1
  #   static_configs:
  #     - targets: ['10.0.0.5:9100', '10.0.0.5:9835']  # node_exporter + nvidia_gpu_exporter
  #       labels:
  #         instance: '10.0.0.5'
